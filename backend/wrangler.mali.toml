name = "camaroom-cart-backend-mali"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# TODO(mali-momo): Mali has no confirmed mobile-money account yet. These are
# deliberately empty rather than carrying Cameroon's MTN number, which a
# customer in Mali cannot pay into (MTN does not operate there) — quote.js
# detects the empty values and tells the customer the team will send payment
# details on WhatsApp instead of printing an account that would fail.
# Fill both in once the real Orange Money / Moov Money number and account
# name are confirmed, then redeploy.
MOMO_TRANSFER_NUMBER = ""
MOMO_ACCOUNT_NAME = ""
ORDER_CURRENCY = "XOF"
MOMO_NETWORK_LABEL = "Orange Money or Moov Money"

[[d1_databases]]
binding = "DB"
database_name = "camaroom-orders-mali"
database_id = "4665bf6e-8c14-4e7b-8a09-a67bfb97daf6"
